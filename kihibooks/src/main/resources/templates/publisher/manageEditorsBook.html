<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout.html}">
<head>
<meta charset="UTF-8">
<title>KiHiBooks - 담당 작품 관리</title>
<style>
    :root {
        --assignment-primary: #f26b3a;
        --assignment-primary-dark: #dc5728;
        --assignment-primary-soft: #fff1eb;
        --assignment-ink: #18212f;
        --assignment-muted: #566273;
        --assignment-line: #d9dee5;
        --assignment-bg: #f3f5f7;
        --assignment-surface: #fff;
        --assignment-success: #16865c;
        --assignment-panel-height: clamp(560px, calc(100vh - 255px), 700px);
    }
    .assignment-page, .assignment-page * { box-sizing: border-box; }
    .assignment-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 26px 20px 56px;
        color: var(--assignment-ink);
    }
    .assignment-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
    }
    .assignment-eyebrow {
        margin-bottom: 8px;
        color: var(--assignment-primary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .12em;
    }
    .assignment-title {
        margin: 0 0 7px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -.04em;
    }
    .assignment-subtitle { margin: 0; color: var(--assignment-muted); font-size: 14px; }
    .summary-group { display: flex; gap: 10px; }
    .summary-card {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 145px;
        padding: 13px 15px;
        border-radius: 12px;
        background: var(--assignment-ink);
        color: #fff;
        box-shadow: 0 8px 24px rgba(24, 33, 47, .12);
    }
    .summary-card.secondary { background: #303b4b; }
    .summary-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, .1);
        color: #ff9a75;
    }
    .summary-icon svg, .search-icon svg, .empty-icon svg { width: 18px; height: 18px; }
    .summary-label { display: block; color: #b6bec9; font-size: 11px; font-weight: 700; }
    .summary-value { display: block; margin-top: 2px; font-size: 19px; font-weight: 800; }
    .assignment-panel {
        display: flex;
        height: var(--assignment-panel-height);
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--assignment-line);
        border-radius: 14px;
        background: var(--assignment-surface);
        box-shadow: 0 7px 24px rgba(24, 33, 47, .075);
    }
    .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 19px 22px;
        border-bottom: 1px solid var(--assignment-line);
    }
    .panel-title { margin: 0 0 5px; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .panel-description { margin: 0; color: var(--assignment-muted); font-size: 13px; line-height: 1.55; }
    .panel-actions { display: flex; align-items: center; gap: 9px; }
    .search-control { position: relative; width: 230px; }
    .search-icon {
        position: absolute;
        top: 50%;
        left: 11px;
        display: inline-flex;
        color: #7d8795;
        pointer-events: none;
        transform: translateY(-50%);
    }
    #book-search {
        width: 100%;
        height: 38px;
        padding: 0 12px 0 37px;
        border: 1px solid var(--assignment-line);
        border-radius: 8px;
        background: #fff;
        color: var(--assignment-ink);
        font-size: 12px;
        outline: none;
        transition: border-color .18s ease, box-shadow .18s ease;
    }
    #book-search::placeholder { color: #929ba7; }
    #book-search:focus { border-color: #f2a387; box-shadow: 0 0 0 3px rgba(242, 107, 58, .1); }
    .account-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--assignment-line);
        border-radius: 8px;
        background: #fff;
        color: #374151;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
    }
    .account-link:hover { border-color: #f3b49e; color: var(--assignment-primary); }
    .table-wrap {
        min-height: 0;
        flex: 1 1 auto;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-color: #b7bec8 #f2f4f6;
        scrollbar-width: thin;
    }
    .table-wrap::-webkit-scrollbar { width: 9px; height: 9px; }
    .table-wrap::-webkit-scrollbar-track { background: #f2f4f6; }
    .table-wrap::-webkit-scrollbar-thumb { border: 2px solid #f2f4f6; border-radius: 999px; background: #b7bec8; }
    .assignment-table { width: 100%; min-width: 880px; margin: 0; border-collapse: collapse; }
    .assignment-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 12px 16px;
        border-bottom: 1px solid var(--assignment-line);
        background: #fafbfc;
        color: var(--assignment-muted);
        font-size: 12px;
        font-weight: 800;
        text-align: left;
    }
    .assignment-table th:last-child { text-align: right; }
    .assignment-table td {
        padding: 14px 16px;
        border-bottom: 1px solid #edf0f3;
        color: #374151;
        font-size: 14px;
        vertical-align: middle;
    }
    .assignment-table tbody tr:last-child td { border-bottom: 0; }
    .assignment-table tbody tr:hover { background: #fffaf8; }
    .book-profile { display: flex; align-items: center; gap: 11px; min-width: 210px; }
    .book-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 42px;
        flex: 0 0 36px;
        border-radius: 5px 9px 9px 5px;
        background: var(--assignment-primary-soft);
        color: var(--assignment-primary);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: .04em;
        box-shadow: inset 3px 0 0 #ffd1c0;
    }
    .book-title { max-width: 260px; overflow: hidden; color: var(--assignment-ink); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .book-code { margin-top: 3px; color: #7d8795; font-size: 10px; font-weight: 700; }
    .author-name { color: var(--assignment-muted); font-weight: 700; }
    .editor-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 9px;
        border-radius: 999px;
        background: #edf7f3;
        color: var(--assignment-success);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
    }
    .editor-chip::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .editor-chip.unassigned { background: #f0f2f5; color: #697386; }
    .delegate-select {
        width: 100%;
        min-width: 165px;
        height: 38px;
        padding: 0 34px 0 11px;
        border: 1px solid var(--assignment-line);
        border-radius: 8px;
        background: #fff;
        color: #374151;
        font-size: 12px;
        font-weight: 700;
        outline: none;
    }
    .delegate-select:focus { border-color: #f2a387; box-shadow: 0 0 0 3px rgba(242, 107, 58, .1); }
    .button-cell { text-align: right; white-space: nowrap; }
    .manage-btn {
        height: 34px;
        padding: 0 11px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        transition: border-color .18s ease, background .18s ease, color .18s ease;
    }
    .manage-btn:disabled { cursor: wait; opacity: .6; }
    .change-btn { border: 1px solid var(--assignment-primary); background: var(--assignment-primary); color: #fff; }
    .change-btn:hover { border-color: var(--assignment-primary-dark); background: var(--assignment-primary-dark); }
    .keep-btn { margin-left: 5px; border: 1px solid var(--assignment-line); background: #fff; color: #566273; }
    .keep-btn:hover { border-color: #aeb6c1; background: var(--assignment-bg); color: var(--assignment-ink); }
    .empty-row td { height: 320px; text-align: center; }
    .empty-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        margin: 0 auto 11px;
        border-radius: 12px;
        background: var(--assignment-bg);
        color: #7d8795;
    }
    .empty-title { color: var(--assignment-ink); font-size: 14px; font-weight: 800; }
    .empty-description { margin-top: 4px; color: var(--assignment-muted); font-size: 12px; }
    .panel-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex: 0 0 auto;
        padding: 14px 22px;
        border-top: 1px solid var(--assignment-line);
        color: var(--assignment-muted);
        font-size: 12px;
    }
    .panel-foot strong { color: var(--assignment-ink); }
    .back-link { color: var(--assignment-muted); font-weight: 800; }
    .back-link:hover { color: var(--assignment-primary); }
    .feedback-toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 1050;
        max-width: calc(100vw - 44px);
        padding: 12px 15px;
        border-radius: 9px;
        background: var(--assignment-ink);
        color: #fff;
        box-shadow: 0 10px 30px rgba(24, 33, 47, .2);
        font-size: 12px;
        font-weight: 700;
    }
    @media (max-width: 820px) {
        .assignment-page { padding: 20px 14px 40px; }
        .assignment-hero { align-items: stretch; flex-direction: column; }
        .assignment-title { font-size: 25px; }
        .summary-group { width: 100%; }
        .summary-card { min-width: 0; flex: 1; }
        .assignment-panel { height: 620px; }
        .panel-head { align-items: stretch; flex-direction: column; padding: 17px 16px; }
        .panel-actions { width: 100%; }
        .search-control { width: auto; flex: 1; }
        .panel-foot { padding: 13px 16px; }
    }
    @media (max-width: 480px) {
        .summary-group { flex-direction: column; }
        .panel-actions { align-items: stretch; flex-direction: column; }
        .search-control, .account-link { width: 100%; }
        .assignment-panel { height: 650px; }
    }
</style>
</head>
<body>
<main layout:fragment="content" class="assignment-page">
    <section class="assignment-hero">
        <div>
            <div class="assignment-eyebrow">CONTENT ASSIGNMENT</div>
            <h1 class="assignment-title">담당 작품 관리</h1>
            <p class="assignment-subtitle"><span th:text="${publisherName}">출판사</span>의 작품별 담당 에디터를 지정하거나 보관할 수 있습니다.</p>
        </div>
        <div class="summary-group" aria-label="담당 작품 현황">
            <div class="summary-card">
                <span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg></span>
                <span><span class="summary-label">관리 작품</span><strong class="summary-value"><span th:text="${#lists.size(books)}">0</span>권</strong></span>
            </div>
            <div class="summary-card secondary">
                <span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg></span>
                <span><span class="summary-label">등록 에디터</span><strong class="summary-value"><span th:text="${#lists.size(editors)}">0</span>명</strong></span>
            </div>
        </div>
    </section>

    <section class="assignment-panel" aria-labelledby="assignment-list-title">
        <div class="panel-head">
            <div>
                <h2 class="panel-title" id="assignment-list-title">작품별 담당 설정</h2>
                <p class="panel-description">변경할 에디터를 선택한 뒤 ‘담당 변경’을 눌러 적용합니다.</p>
            </div>
            <div class="panel-actions">
                <label class="search-control" for="book-search">
                    <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span>
                    <input id="book-search" type="search" placeholder="도서명 또는 작가 검색" autocomplete="off">
                </label>
                <a class="account-link" th:href="@{/publisher/editors}">에디터 계정 관리</a>
            </div>
        </div>

        <div class="table-wrap">
            <table class="assignment-table">
                <thead>
                    <tr><th scope="col">작품</th><th scope="col">작가</th><th scope="col">현재 담당</th><th scope="col">변경할 에디터</th><th scope="col">관리</th></tr>
                </thead>
                <tbody id="book-list" th:if="${books != null and !books.isEmpty()}">
                    <tr class="book-row" th:each="book : ${books}" th:data-search="${book.bo_title + ' ' + book.bo_author}">
                        <td>
                            <div class="book-profile">
                                <!-- <span class="book-mark" aria-hidden="true">BOOK</span> -->
                                <div><div class="book-title" th:text="${book.bo_title}" th:title="${book.bo_title}">도서명</div><div class="book-code" th:text="${book.bo_code}">BOOK CODE</div></div>
                            </div>
                        </td>
                        <td class="author-name" th:text="${book.bo_author}">작가명</td>
                        <td>
                            <span class="editor-chip" th:classappend="${book.bo_editor == null or #strings.isEmpty(book.bo_editor)} ? 'unassigned'" th:text="${book.bo_editor == null or #strings.isEmpty(book.bo_editor) ? '미지정' : book.bo_editor}">담당 에디터</span>
                        </td>
                        <td>
                            <select class="delegate-select" th:attr="aria-label=${book.bo_title + ' 담당 에디터 선택'}">
                                <option value="0" selected>에디터를 선택하세요</option>
                                <option th:each="editor : ${editors}" th:value="${editor.pi_num}" th:text="${editor.ur_nickname}">에디터</option>
                            </select>
                        </td>
                        <td class="button-cell">
                            <button type="button" class="change-btn manage-btn" th:data-bo-code="${book.bo_code}" th:data-book-title="${book.bo_title}">담당 변경</button>
                            <button type="button" class="keep-btn manage-btn" th:data-bo-code="${book.bo_code}" th:data-book-title="${book.bo_title}">보관</button>
                        </td>
                    </tr>
                </tbody>
                <tbody th:if="${books == null or books.isEmpty()}">
                    <tr class="empty-row"><td colspan="5">
                        <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg></span>
                        <div class="empty-title">관리할 작품이 없습니다.</div><div class="empty-description">출판사에 등록된 작품이 이곳에 표시됩니다.</div>
                    </td></tr>
                </tbody>
                <tbody id="search-empty" hidden>
                    <tr class="empty-row"><td colspan="5"><div class="empty-title">검색 결과가 없습니다.</div><div class="empty-description">다른 도서명이나 작가명을 입력해 보세요.</div></td></tr>
                </tbody>
            </table>
        </div>

        <div class="panel-foot">
            <span>현재 <strong id="visible-book-count" th:text="${#lists.size(books)}">0</strong>개 작품 표시</span>
            <a class="back-link" th:href="@{/publisher/dashboard}">← 대시보드로</a>
        </div>
    </section>
    <div id="feedback-toast" class="feedback-toast" role="status" aria-live="polite" hidden></div>
</main>

<script layout:fragment="script">
    $(function () {
        const $bookRows = $(".book-row");
        const $searchEmpty = $("#search-empty");

        function showFeedback(message) {
            const $toast = $("#feedback-toast");
            $toast.stop(true, true).text(message).prop("hidden", false).fadeIn(120);
            window.setTimeout(function () { $toast.fadeOut(180, function () { $toast.prop("hidden", true); }); }, 2400);
        }

        $("#book-search").on("input", function () {
            const keyword = $.trim($(this).val()).toLocaleLowerCase();
            let visibleCount = 0;
            $bookRows.each(function () {
                const searchableText = String($(this).data("search") || "").toLocaleLowerCase();
                const isVisible = !keyword || searchableText.indexOf(keyword) !== -1;
                $(this).toggle(isVisible);
                if (isVisible) visibleCount += 1;
            });
            $("#visible-book-count").text(visibleCount);
            $searchEmpty.prop("hidden", visibleCount !== 0 || $bookRows.length === 0);
        });

        $(document).on("click", ".change-btn", function () {
            const $button = $(this);
            const piNum = $button.closest("tr").find(".delegate-select").val();
            const bookTitle = $button.data("book-title") || "선택한 작품";
            if (piNum === "0") { showFeedback("변경할 에디터를 먼저 선택해 주세요."); return; }
            if (!window.confirm(bookTitle + "의 담당 에디터를 변경할까요?")) return;

            $button.prop("disabled", true).text("변경 중...");
            $.ajax({
                url: "/publisher/changeEditor",
                method: "POST",
                data: { bo_code: $button.data("bo-code"), pi_num: piNum },
                success: function (response) {
                    if (response) { showFeedback("담당 에디터를 변경했습니다."); window.setTimeout(function () { window.location.reload(); }, 550); }
                    else { showFeedback("담당 에디터 변경에 실패했습니다."); }
                },
                error: function () { showFeedback("서버와 통신하지 못했습니다."); },
                complete: function () { $button.prop("disabled", false).text("담당 변경"); }
            });
        });

        $(document).on("click", ".keep-btn", function () {
            const $button = $(this);
            const bookTitle = $button.data("book-title") || "선택한 작품";
            if (!window.confirm(bookTitle + "을(를) 보관할까요?")) return;

            $button.prop("disabled", true).text("보관 중...");
            $.ajax({
                url: "/publisher/keepBook",
                method: "POST",
                data: { bo_code: $button.data("bo-code") },
                success: function (response) {
                    if (response) { showFeedback("작품을 보관했습니다."); window.setTimeout(function () { window.location.reload(); }, 550); }
                    else { showFeedback("작품 보관에 실패했습니다."); }
                },
                error: function () { showFeedback("서버와 통신하지 못했습니다."); },
                complete: function () { $button.prop("disabled", false).text("보관"); }
            });
        });
    });
</script>
</body>
</html>
